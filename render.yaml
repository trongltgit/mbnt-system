services:
  - type: web
    name: mbnt-system
    runtime: python
    pythonVersion: 3.11
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mbnt_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: postgres
    name: mbnt_db
    ipAllowList: []
    plan: free
